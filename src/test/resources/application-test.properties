spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

auth.jwt.secret=dev-test-secret-key-must-be-at-least-32-chars-long
auth.jwt.issuer=geradortimes-test
auth.jwt.access-token-ttl=15m
auth.jwt.refresh-token-ttl=30d
auth.jwt.registration-token-ttl=30m
auth.jwt.refresh-token-salt=dev-test-refresh-token-salt-must-be-32-chars

auth.cookie.refresh-token-name=refreshToken
auth.cookie.path=/api/auth
auth.cookie.secure=false
auth.cookie.same-site=Lax

argon.hash.pepper=dev-test-pepper
argon.hash.memory=65536
argon.hash.iterations=3
argon.hash.parallelism=4

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.mail.host=localhost
spring.mail.port=25

app.rabbitmq.exchange=user.events
app.rabbitmq.queue=user.email.confirmation.queue
app.rabbitmq.routing-key=user.registered
app.rabbitmq.password-reset.queue=user.email.password-reset.queue
app.rabbitmq.password-reset.routing-key=user.password-reset

app.email.verification.base-url=http://localhost:4200
app.email.from=noreply@geradortimes.com
app.email.from-name=GeradorTimes

app.rate-limit.max-requests=100
app.rate-limit.window-seconds=60