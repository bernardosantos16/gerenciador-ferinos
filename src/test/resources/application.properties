spring.datasource.url=jdbc:h2:mem:geradortimes_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

auth.jwt.secret=dev-test-secret
auth.jwt.issuer=geradortimes-test
auth.jwt.access-token-ttl=15m
auth.jwt.refresh-token-ttl=30d
auth.jwt.refresh-token-salt=dev-test-refresh-salt
