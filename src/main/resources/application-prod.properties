server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

auth.jwt.secret=${JWT_SECRET}
auth.jwt.issuer=${JWT_ISSUER:geradortimes}
auth.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
auth.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:30d}
auth.jwt.registration-token-ttl=${JWT_REGISTRATION_TTL:30m}
auth.jwt.refresh-token-salt=${JWT_REFRESH_SALT}

auth.cookie.refresh-token-name=${AUTH_COOKIE_REFRESH_NAME}
auth.cookie.path=${AUTH_COOKIE_PATH}
auth.cookie.secure=${AUTH_COOKIE_SECURE}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE}

argon.hash.pepper=${ARGON_PEPPER}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST}

app.rabbitmq.exchange=user.events
app.rabbitmq.queue=user.email.confirmation.queue
app.rabbitmq.routing-key=user.registered
app.rabbitmq.password-reset.queue=user.email.password-reset.queue
app.rabbitmq.password-reset.routing-key=user.password-reset

app.rate-limit.max-requests=3
app.rate-limit.window-seconds=60
app.rate-limit.endpoints[0].path=/api/auth/login
app.rate-limit.endpoints[0].max-requests=5
app.rate-limit.endpoints[0].window-seconds=60
app.rate-limit.endpoints[1].path=/api/auth/refresh
app.rate-limit.endpoints[1].max-requests=10
app.rate-limit.endpoints[1].window-seconds=60
app.rate-limit.endpoints[2].path=/api/users/email
app.rate-limit.endpoints[2].max-requests=2
app.rate-limit.endpoints[2].window-seconds=60
app.rate-limit.endpoints[3].path=/api/users/verify-email
app.rate-limit.endpoints[3].max-requests=3
app.rate-limit.endpoints[3].window-seconds=60
app.rate-limit.endpoints[4].path=/api/users/forgot-password
app.rate-limit.endpoints[4].max-requests=2
app.rate-limit.endpoints[4].window-seconds=60
app.rate-limit.endpoints[5].path=/api/users/reset-password
app.rate-limit.endpoints[5].max-requests=3
app.rate-limit.endpoints[5].window-seconds=60
app.rate-limit.endpoints[6].path=/api/users
app.rate-limit.endpoints[6].max-requests=3
app.rate-limit.endpoints[6].window-seconds=60
app.rate-limit.endpoints[7].path=/api/teams/generate
app.rate-limit.endpoints[7].max-requests=10
app.rate-limit.endpoints[7].window-seconds=60