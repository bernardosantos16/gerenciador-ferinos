spring.datasource.url=${JDBC_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

auth.jwt.secret=${JWT_SECRET}
auth.jwt.issuer=${JWT_ISSUER:geradortimes}
auth.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
auth.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:30d}
auth.jwt.refresh-token-salt=${JWT_REFRESH_SALT}

auth.cookie.refresh-token-name=${AUTH_COOKIE_REFRESH_NAME}
auth.cookie.path=${AUTH_COOKIE_PATH}
auth.cookie.secure=${AUTH_COOKIE_SECURE}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE}

argon.hash.pepper=${ARGON_PEPPER}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

app.rabbitmq.exchange=user.events
app.rabbitmq.queue=user.email.confirmation.queue
app.rabbitmq.routing-key=user.registered

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.verification.base-url=${EMAIL_VERIFICATION_BASE_URL}
app.email.from=${EMAIL_FROM}
app.email.from-name=${EMAIL_FROM_NAME}
