spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

auth.jwt.secret=${JWT_SECRET:dev-secret-change-me}
auth.jwt.issuer=${JWT_ISSUER:geradortimes-dev}
auth.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
auth.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:30d}
auth.jwt.refresh-token-salt=${JWT_REFRESH_SALT:dev-refresh-salt-change-me}

auth.cookie.refresh-token-name=${AUTH_COOKIE_REFRESH_NAME:refreshToken}
auth.cookie.path=${AUTH_COOKIE_PATH:/api/auth}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Lax}

argon.hash.pepper=${ARGON_PEPPER:dev-pepper-change-me}

springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.tagsSorter=alpha

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=user.events
app.rabbitmq.queue=user.email.confirmation.queue
app.rabbitmq.routing-key=user.registered

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.email.verification.base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:4200}
app.email.from=${EMAIL_FROM:noreply@geradortimes.com}
app.email.from-name=${EMAIL_FROM_NAME:GeradorTimes}
