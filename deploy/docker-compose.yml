services:
  app:
    image: ${DOCKER_USERNAME}/gerador-times-app:latest
    container_name: gerador-times-app
    restart: unless-stopped
    env_file:
      - /home/ubuntu/gerador-times.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - OTEL_SERVICE_NAME=gerador-times
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=none
    expose:
      - "8080"
    networks:
      - gerador_times_net

  email-service:
    image: ${DOCKER_USERNAME}/email-service:latest
    container_name: email-service
    restart: unless-stopped
    env_file:
      - /home/ubuntu/email-service.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - OTEL_SERVICE_NAME=email-service
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=none
    networks:
      - gerador_times_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/certbot/conf:/etc/letsencrypt:ro
      - /home/ubuntu/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - gerador_times_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - /home/ubuntu/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo
      - loki
    networks:
      - gerador_times_net

  tempo:
    image: grafana/tempo:2.7.1
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - /home/ubuntu/observability/tempo-config.yaml:/etc/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - gerador_times_net

  loki:
    image: grafana/loki:3.4.3
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki-config.yaml"]
    volumes:
      - /home/ubuntu/observability/loki-config.yaml:/etc/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - gerador_times_net

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /home/ubuntu/observability/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - /home/ubuntu/observability/prometheus-alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gerador_times_net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - /home/ubuntu/observability/alertmanager-config.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - gerador_times_net

  promtail:
    image: grafana/promtail:3.4.3
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail-config.yaml"]
    volumes:
      - /home/ubuntu/observability/promtail-config.yaml:/etc/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gerador_times_net

  grafana:
    image: grafana/grafana:11.5.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - /home/ubuntu/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - /home/ubuntu/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - /home/ubuntu/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - gerador_times_net

networks:
  gerador_times_net:
    driver: bridge

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
